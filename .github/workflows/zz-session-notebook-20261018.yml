name: Publish the retained controlled-study notebook
on:
  push:
    branches: [cleanup/public-surface-20261018]
    paths: [.github/workflows/zz-session-notebook-20261018.yml]
permissions:
  contents: write
jobs:
  notebook:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.12.13'
          enable-cache: false
      - name: Bind the retained chart to its original frozen protocol
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          p=Path('notebooks/09_controlled_feature_study.ipynb')
          raw=p.read_bytes()
          if hashlib.sha256(raw).hexdigest()!='11fa0840f7dfdf3f2c1a012aa86677d2a45bfc2fc2efe975d53dc178f8eafb99':
              raise ValueError('Notebook changed before repair')
          nb=json.loads(raw)
          header="import tomllib\n\nrobustness_plan = tomllib.loads((ROOT / 'configs/robustness.toml').read_text())\nexpected_plan = hashlib.sha256(json.dumps(robustness_plan, sort_keys=True, separators=(',', ':'), allow_nan=False).encode()).hexdigest()\n"
          old="verified_ids = {r['cell_id'] for r in robustness['cells'] if r['status'].startswith('verified')}"
          text=''.join(nb['cells'][-1]['source'])
          if old not in text: raise ValueError('Expected historical chart not found')
          text=header+text.replace(old,"verified_ids = {f\"{w['name']}_seed_{s}\" for w in robustness_plan['windows'] for s in robustness_plan['model_seeds']}")
          nb['cells'][-1]['source']=text.splitlines(keepends=True)
          nb['cells'][21]['source']=''.join(nb['cells'][21]['source']).split(' Earlier neural benchmarks')[0].splitlines(keepends=True)
          for cell in nb['cells']:
              if cell['cell_type']=='code': cell['execution_count']=None; cell['outputs']=[]
          data=(json.dumps(nb,indent=1,ensure_ascii=False)+'\n').encode()
          if hashlib.sha256(data).hexdigest()!='d678a51eb8e75220e8854e5f7f678b0bac81ca4f63c1c6a6a5c9e1f7179ef50e':
              raise ValueError('Repaired source differs from reviewed source')
          p.write_bytes(data)
      - name: Re-execute, reuse, and seal actual notebook outputs
        run: |
          uv venv /tmp/otto-analysis --python 3.12.13 --no-project
          uv pip install --python /tmp/otto-analysis/bin/python --require-hashes -r notebooks/requirements.txt
          /tmp/otto-analysis/bin/python scripts/execute_notebooks.py
          /tmp/otto-analysis/bin/python scripts/execute_notebooks.py
          /tmp/otto-analysis/bin/python scripts/publish_notebooks.py
      - name: Commit only the reviewed notebook and execution receipt
        run: |
          git add notebooks/09_controlled_feature_study.ipynb notebooks/execution.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Execute the retained controlled study against its frozen protocol'
          git push origin HEAD:cleanup/public-surface-20261018
          git archive --format=zip --output="$RUNNER_TEMP/public-source.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/public-source-commit.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: curated-notebook-source
          path: |
            ${{ runner.temp }}/public-source.zip
            ${{ runner.temp }}/public-source-commit.txt
          retention-days: 3
          if-no-files-found: warn
