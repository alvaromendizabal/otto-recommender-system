name: Stage verified public review
on:
  push:
    branches: [portfolio/employer-review-20261012]
    paths: [.github/workflows/stage-public-review.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          ref: portfolio/employer-review-20261012
      - name: Run the inspected checksum-bound public staging script
        shell: bash
        run: |
          python3 -B -S - <<'PY'
          import hashlib, os, subprocess, sys, urllib.request
          from pathlib import Path
          url = 'https://raw.githubusercontent.com/alvaromendizabal/lava-aws-multilingual-docvqa/aad4c3aa890d847b76f3ddee8bdde6019062cea0/.review-staging/stage_public_review.py'
          with urllib.request.urlopen(url, timeout=30) as response:
              data = response.read(10001)
          if hashlib.sha256(data).hexdigest() != '93b673db9bc9a4809fa8b0510530ab0aa379403f2a5b03d8f56ff16806064f0f':
              raise RuntimeError('Staging implementation checksum mismatch')
          script = Path(os.environ['RUNNER_TEMP'], 'stage_public_review.py')
          script.write_bytes(data)
          subprocess.run([sys.executable, '-B', '-S', str(script)], check=True, timeout=180)
          PY
      - name: Retain exact publication receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-review-staging
          path: ${{ runner.temp }}/public-review-staging.json
          if-no-files-found: error
          retention-days: 14
