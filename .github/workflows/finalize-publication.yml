name: Finalize public provenance

on:
  push:
    branches: [portfolio/reproducible-closeout-20261012]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.13.15'
          enable-cache: true
      - name: Repair only authenticated public metadata identities
        run: |
          git fetch --no-tags --depth=1 origin 95fa2c6a3ad99f6e501fc5ce80b08502f633cc64
          python tools/finalize_public_projection.py
          python tools/check_public_boundary.py
          python tools/sanitize_public_metadata.py
          uv sync --frozen --extra dev --extra ml
          uv run --frozen --extra dev --extra ml python -m pytest -q tests/test_current_frontier_publication.py tests/test_ensemble_validation_publication.py tests/test_feature_gate.py tests/test_project_status.py tests/test_research_robustness.py tests/test_robustness_report.py tests/test_robustness_pipeline.py tests/test_temporal_robustness.py -W error
      - name: Regenerate and verify evidence-derived presentation
        run: |
          uv venv /tmp/otto-analysis --python 3.12.13 --no-project
          uv pip install --python /tmp/otto-analysis/bin/python --require-hashes -r notebooks/requirements.txt
          /tmp/otto-analysis/bin/python scripts/build_portfolio_figures.py
          /tmp/otto-analysis/bin/python scripts/build_portfolio_figures.py --check
          /tmp/otto-analysis/bin/python scripts/execute_notebooks.py
          /tmp/otto-analysis/bin/python scripts/execute_notebooks.py
          /tmp/otto-analysis/bin/python scripts/publish_notebooks.py
          python tools/check_public_boundary.py
          python -S scripts/review_portfolio.py
      - name: Commit only validated publication derivatives
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          allowed = set(json.loads(Path('reports/privacy/redactions.json').read_text())['nested_metadata_projection']['files'])
          allowed.update(('README.md', 'reports/privacy/redactions.json', 'notebooks/execution.json'))
          allowed.update(str(p) for p in Path('notebooks').glob('[0-9][0-9]_*.ipynb'))
          allowed.update(str(p) for p in Path('reports/portfolio').glob('*') if p.is_file())
          changed = set(filter(None, subprocess.check_output(['git','diff','--name-only','-z']).decode().split('\0')))
          if changed - allowed:
              raise SystemExit('Unexpected publication changes')
          for name in sorted(allowed):
              if Path(name).is_file():
                  subprocess.run(['git','add','--',name],check=True)
          PY
          if git diff --cached --quiet; then exit 0; fi
          git fetch --no-tags origin refs/heads/portfolio/reproducible-closeout-20261012
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve canonical public provenance through nested metadata redaction'
          git push origin HEAD:refs/heads/portfolio/reproducible-closeout-20261012
