name: Rebuild verified offline report
on:
  push:
    branches: [maintenance/final-artifact-audit-20261020]
    paths: [.github/workflows/zz-report-rebuild.yml]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.12.13'
          enable-cache: false
      - name: Preserve original evidence and apply only the inspected link-label correction
        shell: python
        run: |
          import hashlib,json,os,subprocess
          from pathlib import Path
          base='928c2c2e46566c9245252732f2b032ec39e826d2'
          if subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip()!=base:
              raise ValueError('Main advanced; reconcile rather than overwrite')
          p=Path('scripts/build_portfolio_figures.py')
          raw=p.read_bytes()
          if hashlib.sha256(raw).hexdigest()!='bad2b943b672b662f2ec07ed3814b06a8f39fc8dfa74281e3bb86590dd39b1ce':
              raise ValueError('Generator changed before reviewed correction')
          old=b"docs/MODEL_CARD.md'>Full case study"
          new=b"docs/MODEL_CARD.md'>Model card"
          if raw.count(old)!=1: raise ValueError('Expected one link-label occurrence')
          p.write_bytes(raw.replace(old,new))
          if hashlib.sha256(p.read_bytes()).hexdigest()!='979027c59ab0f79d4786e2d6c844df332ddc9b7b2ae6f3d9648fd04d72661201':
              raise ValueError('Unexpected output generator')
          pins={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('reports').rglob('*')
                if p.is_file() and not str(p).startswith('reports/portfolio/')}
          notebooks={str(p):[(c['cell_type'],c['source']) for c in json.loads(p.read_text())['cells']]
                     for p in Path('notebooks').glob('*.ipynb')}
          Path(os.environ['RUNNER_TEMP'],'original-evidence.json').write_text(json.dumps({'files':pins,'notebooks':notebooks}))
      - name: Install the original hash-locked analysis stack
        run: |
          uv venv /tmp/otto-analysis --python 3.12.13 --no-project
          uv pip install --python /tmp/otto-analysis/bin/python --require-hashes -r notebooks/requirements.txt
      - name: Rebuild real plots and verify the complete offline download
        run: |
          /tmp/otto-analysis/bin/python scripts/build_portfolio_figures.py
          /tmp/otto-analysis/bin/python scripts/build_portfolio_figures.py --check
          python3 -S -m unittest discover -s tools -p test_report_artifacts.py -v
      - name: Re-execute and seal the unchanged controlled-study sources
        run: |
          /tmp/otto-analysis/bin/python scripts/execute_notebooks.py
          /tmp/otto-analysis/bin/python scripts/execute_notebooks.py
          /tmp/otto-analysis/bin/python scripts/publish_notebooks.py
          python3 -B -S review/run.py --render
          python3 -B -S review/run.py --output "$RUNNER_TEMP/public-review"
          python3 -B -S review/run.py --output "$RUNNER_TEMP/public-review" --check
      - name: Verify preserved evidence and publish only the derived source changes
        shell: python
        run: |
          import hashlib,json,os,subprocess
          from pathlib import Path
          saved=json.loads(Path(os.environ['RUNNER_TEMP'],'original-evidence.json').read_text())
          for name,digest in saved['files'].items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest()!=digest:
                  raise ValueError('Original research evidence changed: '+name)
          for name,cells in saved['notebooks'].items():
              current=[[c['cell_type'],c['source']] for c in json.loads(Path(name).read_text())['cells']]
              if current!=cells: raise ValueError('Computational notebook source changed: '+name)
          subprocess.run(['git','add','scripts/build_portfolio_figures.py','reports/portfolio',
                          'notebooks','review/index.html'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          allowed=('reports/portfolio/','notebooks/')
          if any(not(n.startswith(allowed) or n in {'scripts/build_portfolio_figures.py','review/index.html'}) for n in names):
              raise ValueError('Unexpected staged files')
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','Regenerate the canonical interactive report and verify unchanged research evidence'],check=True)
          subprocess.run(['git','push','origin','HEAD:maintenance/final-artifact-audit-20261020'],check=True)
          out=Path(os.environ['RUNNER_TEMP'])
          subprocess.run(['git','archive','--format=zip','--output='+str(out/'public-source.zip'),'HEAD'],check=True)
          (out/'commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          print('ORIGINAL_RESEARCH_AND_NOTEBOOK_SOURCES_UNCHANGED')
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repaired-report-public-source
          path: |
            ${{ runner.temp }}/public-source.zip
            ${{ runner.temp }}/commit.txt
          if-no-files-found: error
          retention-days: 3
