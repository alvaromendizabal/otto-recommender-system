name: reproducibility

on:
  push:
    branches: [main, 'portfolio/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-publication:
    if: github.event_name == 'push' && github.ref == 'refs/heads/portfolio/reproducible-closeout-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.13.15'
          enable-cache: true
      - name: Prepare authenticated public references and typed source
        run: |
          uv sync --frozen --extra dev --extra ml
          python tools/finalize_portfolio.py
          uv run --frozen --extra dev --extra ml ruff format reproduce.py scripts/reproduce_reference.py tests/test_public_reproduction.py tests/test_publication_closeout.py tools/sanitize_public_metadata.py tools/check_public_boundary.py
          uv run --frozen --extra dev --extra ml ruff check reproduce.py scripts/reproduce_reference.py tests/test_public_reproduction.py tests/test_publication_closeout.py tools/sanitize_public_metadata.py tools/check_public_boundary.py --fix
          python tools/check_public_boundary.py
          python tools/sanitize_public_metadata.py
          python -S scripts/review_portfolio.py
          uv run --frozen --extra dev --extra ml mypy src scripts
      - name: Regenerate affected figures and executed notebooks from the published evidence
        run: |
          uv venv /tmp/otto-analysis --python 3.12.13 --no-project
          uv pip install --python /tmp/otto-analysis/bin/python --require-hashes -r notebooks/requirements.txt
          /tmp/otto-analysis/bin/python scripts/build_portfolio_figures.py
          /tmp/otto-analysis/bin/python scripts/build_portfolio_figures.py --check
          /tmp/otto-analysis/bin/python scripts/execute_notebooks.py
          /tmp/otto-analysis/bin/python scripts/execute_notebooks.py
          /tmp/otto-analysis/bin/python scripts/publish_notebooks.py
          python tools/check_public_boundary.py
      - name: Publish only declared public-text changes with a branch lease
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          allowed = set(json.loads(Path('reports/privacy/redactions.json').read_text())['files'])
          allowed.update(('reports/privacy/redactions.json', 'reproduce.py', 'scripts/reproduce_reference.py',
                          'tests/test_public_reproduction.py', 'tests/test_publication_closeout.py',
                          'tools/sanitize_public_metadata.py', 'tools/check_public_boundary.py',
                          'configs/feature_research.json', 'notebooks/execution.json',
                          'docs/REPRODUCIBILITY.md', 'docs/PUBLICATION_SCOPE.md',
                          'docs/REVIEWER_GUIDE.md', 'docs/EMPLOYER_OVERVIEW.md'))
          allowed.update(str(p) for p in Path('notebooks').glob('[0-9][0-9]_*.ipynb'))
          allowed.update(str(p) for p in Path('reports/portfolio').glob('*') if p.is_file())
          changed = set(filter(None, subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().split('\0')))
          if changed - allowed:
              raise SystemExit('Undeclared publication changes: ' + repr(sorted(changed - allowed)))
          for path in sorted(allowed):
              if Path(path).is_file():
                  subprocess.run(['git', 'add', '--', path], check=True)
          PY
          if git diff --cached --quiet; then exit 0; fi
          git fetch --no-tags origin "refs/heads/$BRANCH_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: publish re-executed notebooks and redaction-consistent evidence'
          git push origin "HEAD:refs/heads/$BRANCH_NAME"

  native-reference:
    name: Clone-to-native-results
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.13.15'
          enable-cache: true
      - name: Install the project lock
        run: uv sync --frozen --extra dev --extra ml
      - name: Public launcher and publication contracts
        run: uv run --frozen --extra dev --extra ml pytest -q tests/test_public_reproduction.py tests/test_publication_closeout.py tests/test_employer_portfolio_contract.py
      - name: Execute review, native training, exact reuse and verification
        run: |
          .venv/bin/python -S reproduce.py review --output artifacts/review --max-seconds 120
          uv run --frozen --extra dev --extra ml python reproduce.py train --output artifacts/reference --max-seconds 600
          uv run --frozen --extra dev --extra ml python reproduce.py train --output artifacts/reference --max-seconds 600
          .venv/bin/python -S reproduce.py verify --output artifacts/reference
      - name: Retain reproducibility outputs (invented data only)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-reference-reproduction
          path: |
            artifacts/reference/
            artifacts/review/
          if-no-files-found: error
          retention-days: 14

  publication-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python tools/check_public_boundary.py
      - run: python tools/sanitize_public_metadata.py

  source:
    name: Public source snapshot
    needs: publication-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Archive only tracked public files
        run: |
          mkdir -p /tmp/otto-public-source
          git archive --format=zip --output=/tmp/otto-public-source/source.zip HEAD
          git rev-parse HEAD > /tmp/otto-public-source/commit.txt
          cd /tmp/otto-public-source
          sha256sum source.zip > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-source
          path: /tmp/otto-public-source/
          if-no-files-found: error
          retention-days: 7
