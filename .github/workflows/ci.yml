name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.13.15'
          enable-cache: true
      - name: Install the retained locked stack
        run: uv sync --frozen --extra dev --extra ml
      - name: Audit final evidence without dependencies
        run: |
          .venv/bin/python -S scripts/review_portfolio.py
          .venv/bin/python -S -O scripts/review_portfolio.py --json
      - name: Test all retained source and failure paths
        run: uv run --frozen --extra dev --extra ml python scripts/run_quality_gate.py
  notebooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.12.13'
          enable-cache: true
      - name: Install isolated analysis environment
        run: |
          uv venv /tmp/otto-analysis --python 3.12.13 --no-project
          uv pip install --python /tmp/otto-analysis/bin/python --require-hashes -r notebooks/requirements.txt
      - name: Re-execute and verify the retained controlled study
        run: |
          /tmp/otto-analysis/bin/python scripts/execute_notebooks.py
          /tmp/otto-analysis/bin/python scripts/execute_notebooks.py
          /tmp/otto-analysis/bin/python scripts/publish_notebooks.py
      - name: Reject stale report generation, dead review links and mismatched downloads
        run: |
          /tmp/otto-analysis/bin/python scripts/build_portfolio_figures.py --check
          python3 -S -m unittest discover -s tools -p test_report_artifacts.py -v
      - name: Retain executed evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: controlled-study-notebook
          path: artifacts/notebooks/
          if-no-files-found: error
          retention-days: 14
