name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13.15"
          enable-cache: true

      - name: Install locked development stack
        run: uv sync --frozen --extra dev --extra ml

      - name: Quality gate
        run: uv run --frozen --extra dev --extra ml python scripts/run_quality_gate.py
