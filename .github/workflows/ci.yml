name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13.15"
          enable-cache: true
          cache-suffix: quality
      - name: Install locked development stack
        run: uv sync --frozen --extra dev --extra ml
      - name: Ranking, recovery, progress and publication contracts reject Python warnings
        run: >-
          uv run --frozen --extra dev --extra ml python -m pytest -q
          tests/test_ranking_pipeline.py tests/test_ranking_inputs.py
          tests/test_ranking_progress.py tests/test_notebook_publication.py
          tests/test_ranking_results.py -W error
      - name: Quality gate
        if: always()
        run: uv run --frozen --extra dev --extra ml python scripts/run_quality_gate.py
      - name: Ranking and notebook contracts reject Python warnings
        run: uv run --frozen --extra dev --extra ml python -m pytest -q tests/test_lambdarank.py tests/test_notebook_execution.py -W error

  neural-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12.13"
          enable-cache: true
          cache-suffix: neural-contracts
      - name: Create isolated PyTorch contract environment
        run: |
          uv venv /tmp/otto-neural-tests --python 3.12.13 --no-project
          uv pip install --python /tmp/otto-neural-tests/bin/python torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          CC=gcc uv pip install --python /tmp/otto-neural-tests/bin/python -r gpu/two_tower/requirements-test.txt
      - name: Neural quality gate and resume contracts
        working-directory: gpu/two_tower
        run: /tmp/otto-neural-tests/bin/python run_quality_gate.py

  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12.13"
          enable-cache: true
          cache-suffix: notebooks
      - name: Install isolated analysis kernel
        run: |
          uv venv /tmp/otto-analysis --python 3.12.13 --no-project
          uv pip install --python /tmp/otto-analysis/bin/python -r notebooks/requirements.txt
      - name: Execute canonical notebooks and prove reuse
        run: |
          /tmp/otto-analysis/bin/python scripts/execute_notebooks.py
          /tmp/otto-analysis/bin/python scripts/execute_notebooks.py
          /tmp/otto-analysis/bin/python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/notebooks/manifest.json").read_text())
          expected = len(list(Path("notebooks").glob("[0-9][0-9]_*.ipynb")))
          assert report["status"] == "passed"
          assert expected >= 7
          assert report["notebooks"] == report["reused_notebooks"] == expected
          print("OTTO_NOTEBOOK_EXECUTION_AND_RESUME_PASSED")
          PY
      - name: Retain executed notebooks and timestamped evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: executed-notebooks
          path: artifacts/notebooks/
          if-no-files-found: error
          retention-days: 30

  publish-notebooks:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/results/')
    needs: [quality, neural-contracts, notebooks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: notebook-publication-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12.13"
          enable-cache: true
          cache-suffix: notebooks
      - name: Execute and verify publication inputs
        run: |
          uv venv /tmp/otto-analysis --python 3.12.13 --no-project
          uv pip install --python /tmp/otto-analysis/bin/python -r notebooks/requirements.txt
          /tmp/otto-analysis/bin/python scripts/execute_notebooks.py
          /tmp/otto-analysis/bin/python scripts/execute_notebooks.py
          /tmp/otto-analysis/bin/python scripts/publish_notebooks.py
      - name: Commit only verified canonical notebook outputs
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git add -- notebooks/[0-9][0-9]_*.ipynb notebooks/execution.json
          python - <<'PY'
          import re
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          for path in filter(None, paths):
              assert path == 'notebooks/execution.json' or re.fullmatch(r'notebooks/[0-9]{2}_[A-Za-z0-9_]+\.ipynb', path), path
          PY
          if git diff --cached --quiet; then
            echo "OTTO_NOTEBOOK_PUBLICATION_UNCHANGED"
            exit 0
          fi
          git fetch --no-tags origin "refs/heads/$RESULTS_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(notebooks): publish verified executed analysis and receipts"
          git push origin "HEAD:refs/heads/$RESULTS_BRANCH"
          echo "OTTO_NOTEBOOK_PUBLICATION_COMMITTED"
