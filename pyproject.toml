[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "otto-recommender-system"
version = "0.1.0"
description = "Research-grade OTTO multi-objective session recommender."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy==2.5.2",
  "orjson==3.12.0",
  "polars==1.44.1",
  "psutil==7.2.2",
  "pyarrow==25.0.1",
]

[project.optional-dependencies]
ml = [
  "catboost==1.2.10",
  "faiss-cpu==1.15.0",
  "lightgbm==4.7.0",
  "scikit-learn==1.9.0",
  "xgboost==3.4.1",
]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.6",
  "types-psutil==7.2.2.20260827",
]

[tool.hatch.build.targets.wheel]
packages = ["src/otto_recsys"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
  ".venv",
  "data",
  "artifacts",
  "models",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
]
ignore = []

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
